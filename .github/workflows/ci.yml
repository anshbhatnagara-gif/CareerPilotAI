name: CareerPilot AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-architecture-checks:
    name: Security & Architecture Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Audit for Untracked .env Files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: Real .env file is tracked in git repository!"
            exit 1
          fi
          echo "Passed: No tracked .env files detected."

      - name: Audit for Docker Files (No-Docker Policy)
        run: |
          if [ -f Dockerfile ] || [ -f docker-compose.yml ] || [ -f backend/Dockerfile ] || [ -f ai-service/Dockerfile ]; then
            echo "ERROR: Docker configuration files detected! This project strictly uses native cloud runtimes."
            exit 1
          fi
          echo "Passed: Zero Docker files present."

      - name: Frontend Syntax Audit
        run: |
          echo "Checking JavaScript syntax across static frontend files..."
          node -c auth.js onboarding.js assessment.js readiness.js roadmap.js projects.js interview.js

  test-python-ai-service:
    name: Python FastAPI AI Service Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-service/requirements.txt'

      - name: Install FastAPI Dependencies & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt
          pip install pytest httpx

      - name: Execute Pytest Suite
        run: |
          cd ai-service
          pytest

  test-node-backend-and-integration:
    name: Node.js Backend & Integration Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Unit Test Suites
        run: |
          cd backend
          npm run test:auth
          npm run test:profile
          npm run test:assessment
          npm run test:readiness
          npm run test:roadmap
          npm run test:projects
          npm run test:interview
          npm run test:career-tools
          npm run test:ai

      - name: Run AI Dashboard & Frontend Integration Test Suites
        run: |
          cd backend
          node scripts/test-ai-dashboard.js
          node scripts/frontend-auth-test.js
          node scripts/frontend-profile-test.js
          node scripts/frontend-assessment-readiness-test.js
          node scripts/frontend-roadmap-projects-test.js
          node scripts/frontend-interview-careertools-test.js
          node scripts/frontend-localstorage-audit.js
