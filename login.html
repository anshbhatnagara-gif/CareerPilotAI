<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CareerPilot AI - Login to your account">
  <title>Login — CareerPilot AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cinematic Background Layer -->
  <div class="cinematic-bg"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="login.html" class="brand-logo">CareerPilot <span>AI</span></a>
      <span class="brand-tagline">Your Career. Your Fate.</span>
      <a href="login.html" class="back-link">← Back to CareerPilot AI</a>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-wrapper">
    <div class="auth-container">
      
      <!-- Left Column: Hero Horror Heading -->
      <div class="hero-text-block">
        <h1 class="hero-title">
          WELCOME<br>
          <span class="highlight-red">BACK</span>
        </h1>
        <p class="hero-subtitle">Login to continue your career journey.</p>
      </div>

      <!-- Right Column: Authentication Card -->
      <div class="auth-card">
        
        <!-- Error Alert Banner -->
        <div id="error-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          
          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input 
              type="email" 
              id="email" 
              class="form-input" 
              placeholder="Enter your email" 
              required
              autocomplete="email"
            >
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input 
              type="password" 
              id="password" 
              class="form-input" 
              placeholder="Enter your password" 
              required
              autocomplete="current-password"
            >
          </div>

          <button type="submit" class="btn btn-primary">LOGIN</button>

        </form>

        <div class="auth-footer-nav">
          <span>Don't have an account?</span>
          <a href="register.html" class="auth-link">REGISTER</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 CareerPilot AI. All rights reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    // Route protection: Redirect to auth-success if already logged in
    AuthService.redirectIfLoggedIn();

    const loginForm = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Reset alert
      errorAlert.style.display = 'none';
      errorAlert.textContent = '';

      const result = AuthService.login(email, password);

      if (result.success) {
        window.location.href = 'auth-success.html';
      } else {
        errorAlert.textContent = result.message;
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>
</html>
