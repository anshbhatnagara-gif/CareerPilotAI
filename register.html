<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CareerPilot AI - Create your account">
  <title>Register — CareerPilot AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Cinematic Background Layer -->
  <div class="cinematic-bg"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-container">
      <a href="index.html" class="brand-logo">CareerPilot <span>AI</span></a>
      <span class="brand-tagline">Your Career. Your Fate.</span>
      <a href="login.html" class="back-link">← Back to Login</a>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="main-wrapper">
    <div class="auth-container">

      <!-- Left Column: Hero Horror Heading -->
      <div class="hero-text-block">
        <h1 class="hero-title">
          CREATE YOUR<br>
          <span class="highlight-red">ACCOUNT</span>
        </h1>
        <p class="hero-subtitle">Start your personalized career journey.</p>
      </div>

      <!-- Right Column: Authentication Card -->
      <div class="auth-card">

        <!-- Error Alert Banner -->
        <div id="error-alert" class="alert alert-danger" style="display: none;" role="alert"></div>

        <form id="register-form" class="auth-form" novalidate>

          <div class="form-group">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-input" placeholder="Ansh Bhatnagar" required
              autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-input" placeholder="ansh@gmail.com" required
              autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Minimum 8 characters" required
              autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter your password" required
              autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary">REGISTER</button>

        </form>

        <div class="auth-footer-nav">
          <span>Already have an account?</span>
          <a href="login.html" class="auth-link">LOGIN</a>
        </div>

      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 CareerPilot AI. All rights reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script>
    // Route protection: Redirect to auth-success if already logged in
    AuthService.redirectIfLoggedIn();

    const registerForm = document.getElementById('register-form');
    const errorAlert = document.getElementById('error-alert');

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      // Reset alert
      errorAlert.style.display = 'none';
      errorAlert.textContent = '';

      const result = await AuthService.register(fullName, email, password, confirmPassword);

      if (result.success) {
        window.location.href = 'auth-success.html';
      } else {
        errorAlert.textContent = result.message;
        errorAlert.style.display = 'block';
      }
    });
  </script>
</body>

</html>
